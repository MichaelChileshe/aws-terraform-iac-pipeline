name: terraform

# Plan on every pull request; apply only when code lands on main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# OIDC needs id-token: write. pull-requests: write lets us comment the plan.
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  # Paste the role ARN that ./bootstrap output (github_actions_role_arn):
  TF_ROLE_ARN: arn:aws:iam::773475891131:role/ubuntu-retail-github-actions-terraform
  # admin_cidr comes from a repository variable so no IP is hardcoded in git:
  TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}

jobs:
  terraform:
    name: fmt · validate · lint · scan · plan/apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keyless auth: exchange the GitHub OIDC token for temporary AWS creds.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
      - name: TFLint
        run: tflint --init && tflint --recursive

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: true

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false

      # Post the plan as a comment on the PR — the reviewable, auditable diff.
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const plan = (process.env.PLAN || '').substring(0, 60000);
            const body = `### Terraform Plan\n\`\`\`hcl\n${plan}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # Apply only on a push to main (i.e. after the PR is merged).
      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false
